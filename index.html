<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Horta</title>

  <meta name="theme-color" content="#2f8f4e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🌱</span>
      <span class="brand-name">Minha Horta</span>
    </div>
    <div class="top-actions">
      <span id="net" class="net" title="Status da conexão"></span>
      <a href="#/clima" class="icon-btn" aria-label="Clima" title="Clima">☀️</a>

    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#/" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>

    <a href="#/dados" data-tab="dados"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dados</span></a>

  </nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="modal" class="modal" hidden></div>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
